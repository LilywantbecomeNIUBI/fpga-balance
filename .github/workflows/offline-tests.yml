name: Offline RTL and console tests
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update
      - run: sudo apt-get install -y iverilog
      - run: python -m pip install --no-index --find-links vendor/wheels -r requirements.txt
      - run: python tools/selfcheck.py
      - run: python balance/tools/test.py
