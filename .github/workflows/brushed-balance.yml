name: Brushed balance offline checks
on: [push, pull_request]
jobs:
  brushed-balance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brushed_balance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python -m pip install --no-index --find-links vendor/wheels -r requirements.txt
      - run: python tools/selfcheck.py
      - run: python tools/test.py
